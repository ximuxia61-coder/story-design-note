<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みさこのストーリー解説集（テスト）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F7F9;--ink:#1C2E38;--ink-soft:#5C7480;--rose:#2B7A9E;--rose-deep:#1B5A78;--card:#FFFFFF;--line:#D9E6EB;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Zen Kaku Gothic New', sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:920px;margin:0 auto;padding:56px 24px 100px;}
header{margin-bottom:36px;}
.kicker{font-size:12.5px;letter-spacing:.14em;color:var(--rose-deep);margin:0 0 10px;font-weight:500;}
h1{font-family:'Shippori Mincho', serif;font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.35;margin:0;}
h1 .accent{color:var(--rose);}
.controls{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;}
.tab{font-family:inherit;font-size:13px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.search{position:relative;min-width:200px;}
.search input{width:100%;font-family:inherit;font-size:13px;padding:9px 14px 9px 32px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none;}
.search input:focus{border-color:var(--rose);}
.search::before{content:"";position:absolute;left:12px;top:50%;width:11px;height:11px;transform:translateY(-50%);border:1.5px solid var(--ink-soft);border-radius:50%;}
.search::after{content:"";position:absolute;left:20px;top:60%;width:6px;height:1.5px;background:var(--ink-soft);transform:rotate(45deg);}
.count{font-size:12px;color:var(--ink-soft);margin:18px 2px 0;}
.entry{display:grid;grid-template-columns:172px 1fr;gap:32px;padding:36px 0;border-bottom:1px solid var(--line);align-items:start;}
.entry:first-of-type{padding-top:28px;}
.phone{width:172px;height:306px;border-radius:22px;position:relative;overflow:hidden;box-shadow:0 10px 26px -14px rgba(28,46,56,.35);flex-shrink:0;}
.phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.phone .badge{position:absolute;top:10px;left:10px;font-size:9.5px;letter-spacing:.05em;color:#fff;background:rgba(0,0,0,.28);padding:3px 8px;border-radius:999px;}
.no{font-family:'Shippori Mincho', serif;font-size:12.5px;color:var(--rose-deep);letter-spacing:.06em;margin:0 0 6px;}
.tag{display:inline-block;font-size:11px;color:var(--rose-deep);border:1px solid #C7DEE7;background:#EAF4F8;padding:2px 9px;border-radius:999px;margin:0 6px 6px 0;}
.entry-tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px;}
.title{font-family:'Shippori Mincho', serif;font-weight:700;font-size:21px;line-height:1.5;margin:0 0 14px;}
.howto-label{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;margin:0 0 6px;}
.howto{font-size:14px;line-height:1.95;color:var(--ink);margin:0;max-width:56ch;white-space:pre-wrap;}
@media (max-width:600px){.entry{grid-template-columns:1fr;gap:16px;}.phone{width:132px;height:235px;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">STORY DESIGN NOTE</p>
    <h1>みさこの<span class="accent">ストーリー解説集</span></h1>
  </header>
  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="search"><input type="text" id="searchInput" placeholder="キーワードで検索"></div>
  </div>
  <p class="count" id="count"></p>
  <div id="list"></div>
</div>
<script>
const entries = [
  { no:"001", tags:["テストA"], title:"テスト1", howto:"この画像が表示されていれば、images/001.jpg の読み込みに成功しています。", img:"images/001.jpg" },
  { no:"002", tags:["テストA"], title:"テスト2", howto:"この画像が表示されていれば、images/002.jpg の読み込みに成功しています。", img:"images/002.jpg" },
  { no:"003", tags:["テストB"], title:"テスト3", howto:"この画像が表示されていれば、images/003.jpg の読み込みに成功しています。", img:"images/003.jpg" }
];
const gradients = ["linear-gradient(160deg,#BFE3EF,#7FB8CE)","linear-gradient(165deg,#E3F1F6,#B9D9E4)","linear-gradient(180deg,#16303F,#0B1A22)","linear-gradient(180deg,#123249,#0C4258)","linear-gradient(160deg,#D6E9F2,#A9CEDE)","linear-gradient(160deg,#CFE8E4,#9BC9C2)"];
function gradientFor(tag){const t=tag||'未分類';let h=0;for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))%gradients.length;}return gradients[Math.abs(h)];}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
let activeTag='all',query='';
function renderTabs(){
  const allTags=Array.from(new Set(entries.flatMap(e=>e.tags||[]))).filter(Boolean);
  document.getElementById('tabs').innerHTML='<button class="tab '+(activeTag==='all'?'active':'')+'" data-tag="all">すべて</button>'+allTags.map(t=>'<button class="tab '+(activeTag===t?'active':'')+'" data-tag="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>').join('');
}
function renderList(){
  let list=entries.filter(e=>activeTag==='all'||(e.tags||[]).includes(activeTag));
  if(query.trim()){const q=query.trim();list=list.filter(e=>(e.title+e.howto+(e.tags||[]).join('')).includes(q));}
  document.getElementById('count').textContent=list.length+' 件表示中';
  const el=document.getElementById('list');
  if(list.length===0){el.innerHTML='<p style="padding:40px 0;color:var(--ink-soft);font-size:13.5px;">該当する事例がありません。</p>';return;}
  el.innerHTML=list.map(e=>{
    const tags=e.tags||[];const p=tags[0]||'';
    return '<div class="entry"><div class="phone" style="background:'+gradientFor(p)+'">'
      +(e.img?'<img src="'+escapeHtml(e.img)+'" alt="" loading="lazy" onerror="this.remove()">':'')
      +(p?'<span class="badge">'+escapeHtml(p)+(tags.length>1?' +'+(tags.length-1):'')+'</span>':'')
      +'</div><div><p class="no">No.'+escapeHtml(e.no)+'</p><h2 class="title">'+escapeHtml(e.title)+'</h2><div class="entry-tags">'
      +tags.map(t=>'<span class="tag">'+escapeHtml(t)+'</span>').join('')
      +'</div><p class="howto-label">HOW TO</p><p class="howto">'+escapeHtml(e.howto)+'</p></div></div>';
  }).join('');
}
function render(){renderTabs();renderList();}
document.getElementById('tabs').addEventListener('click',ev=>{const b=ev.target.closest('.tab');if(!b)return;activeTag=b.dataset.tag;render();});
document.getElementById('searchInput').addEventListener('input',ev=>{query=ev.target.value;renderList();});
render();
</script>
</body>
</html>
